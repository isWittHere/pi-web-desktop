<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #222; font-family: sans-serif; font-size: 12px; padding: 40px; }
  .row { display: flex; align-items: stretch; gap: 6px; }
  .wrapper {
    display: flex; align-items: stretch; overflow: hidden;
    width: 0px;
    border: 1px solid rgba(128,128,128,.62); border-radius: 7px;
    background: #333; box-shadow: 0 1px 3px rgba(0,0,0,.07);
    transition: width 0.22s cubic-bezier(0.4,0,0.2,1);
    box-sizing: border-box;
  }
  .btn {
    display: flex; align-items: center; flex-shrink: 0;
    width: 100%; max-width: 220px; height: 28px; padding: 0 10px;
    border: 0; background: transparent; color: #aaa; cursor: default;
    font-size: 12px; line-height: 1;
    box-sizing: border-box;
  }
  .viewport { position: relative; overflow: hidden; height: 28px; width: 100%; }
  .stack { display: flex; flex-direction: column; transform: translateY(0px); transition: none; }
  .line { height: 28px; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="row">
  <div id="wrapper" class="wrapper">
    <button class="btn">
      <div class="viewport">
        <div class="stack" id="stack">
          <span class="line" id="current">编辑 foo.ts</span>
        </div>
      </div>
    </button>
  </div>
  <div id="steer" style="width:36px;height:28px;background:#333;border:1px solid #444;border-radius:7px;"></div>
</div>
<script>
  function log() { console.log('[PILL]', ...arguments); }
  const span = document.getElementById('current');
  const stack = document.getElementById('stack');
  const btn = document.querySelector('.btn');
  const wrapper = document.getElementById('wrapper');
  const viewport = document.querySelector('.viewport');

  // 1) 初始（wrapper width 0）：scrollWidth 应报告文本自然宽
  log('initial: span.scrollWidth =', span.scrollWidth,
      '| btn.offsetWidth =', btn.offsetWidth,
      '| viewport.clientWidth =', viewport.clientWidth,
      '| stack.clientWidth =', stack.clientWidth,
      '| wrapper.clientWidth =', wrapper.clientWidth);

  // 2) 模拟测量逻辑：setStepLabelWidth
  const target = Math.min(span.scrollWidth, 220 - 20) + 22;
  log('target width =', target);
  wrapper.style.width = target + 'px';

  requestAnimationFrame(() => {
    log('after set: wrapper.clientWidth =', wrapper.clientWidth,
        '| btn.offsetWidth =', btn.offsetWidth,
        '| viewport.clientWidth =', viewport.clientWidth,
        '| span.clientWidth =', span.clientWidth,
        '| span.scrollWidth =', span.scrollWidth,
        '| text visible? span.scrollWidth > span.clientWidth ?', span.scrollWidth > span.clientWidth);

    // 3) 长→短切换：current 换成短文本，测量 scrollWidth
    span.textContent = '思考';
    // 模拟测量（此时 next 不存在，测 current scrollWidth）
    const w2 = Math.min(span.scrollWidth, 220 - 20) + 22;
    log('long->short: span.scrollWidth =', span.scrollWidth, '| target2 =', w2);
    wrapper.style.width = w2 + 'px';
    requestAnimationFrame(() => {
      log('after shrink: wrapper.clientWidth =', wrapper.clientWidth,
          '| btn.offsetWidth =', btn.offsetWidth,
          '| viewport.clientWidth =', viewport.clientWidth,
          '| span.clientWidth =', span.clientWidth,
          '| span.scrollWidth =', span.scrollWidth,
          '| span text =', JSON.stringify(span.textContent));
    });
  });
</script>
</body>
</html>
